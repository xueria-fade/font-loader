[versions]
# https://kotlinlang.org/docs/home.html
kotlin = "2.4.10"

# https://github.com/Kotlin/kotlinx.coroutines/releases
kotlinx-coroutines = "1.11.0"

# https://github.com/Kotlin/kotlinx.serialization/releases/latest
kotlinx-serialization = "1.11.0"

# https://github.com/detekt/detekt/releases
detekt = "2.0.0-alpha.6"

# https://github.com/vanniktech/gradle-maven-publish-plugin/releases/latest
vanniktech-maven-publish = "0.37.0"

fish-loom = "0.1"

setup-mite = "1.0.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }

fish-loom = { id = "fml-loom", version.ref = "fish-loom" }
setup-mite = { id = "io.github.xueria.mite.setup", version.ref = "setup-mite" }

[libraries]
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[bundles]
